# Tema "Spotify" para o painel web do Hermes Agent.
# Instalar em: ~/.hermes/dashboard-themes/spotify.yaml
# (no nosso Docker: /opt/hermes/data/dashboard-themes/spotify.yaml)
# Ativar: ícone de paleta no cabeçalho do painel -> "Spotify".
# Baseado em DESIGN-spotify.md: fundo quase preto, verde #1ed760 só em
# ações/estados ativos, superfícies acinzentadas, botões em pílula.

name: spotify
label: Spotify
description: Escuro imersivo, verde só em ações, pílulas e sombras pesadas

palette:
  background:
    hex: "#121212"
    alpha: 1.0
  midground:
    hex: "#ffffff"
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0.0
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  fontSans: "Figtree, 'Helvetica Neue', helvetica, arial, sans-serif"
  fontDisplay: "Figtree, 'Helvetica Neue', helvetica, arial, sans-serif"
  fontMono: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  fontUrl: "https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap"
  baseSize: "15px"
  lineHeight: "1.5"
  letterSpacing: "0em"

layout:
  radius: "0.5rem"
  density: comfortable

layoutVariant: standard

componentStyles:
  card:
    boxShadow: "rgba(0, 0, 0, 0.3) 0px 8px 8px"
  header:
    background: "#121212"
  footer:
    background: "#121212"
  sidebar:
    background: "#121212"

colorOverrides:
  primary: "#1ed760"
  primaryForeground: "#000000"
  secondary: "#1f1f1f"
  secondaryForeground: "#ffffff"
  accent: "#272727"
  accentForeground: "#ffffff"
  card: "#181818"
  cardForeground: "#ffffff"
  popover: "#252525"
  popoverForeground: "#ffffff"
  muted: "#1f1f1f"
  mutedForeground: "#b3b3b3"
  destructive: "#f3727f"
  destructiveForeground: "#000000"
  success: "#1ed760"
  warning: "#ffa42b"
  border: "rgba(77, 77, 77, 0.45)"
  input: "#1f1f1f"
  ring: "#ffffff"

customCSS: |
  button.bg-primary,
  a.bg-primary {
    border-radius: 9999px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.4px;
  }
  ::selection {
    background: #1ed760;
    color: #000000;
  }
  * {
    scrollbar-color: #4d4d4d #121212;
  }
