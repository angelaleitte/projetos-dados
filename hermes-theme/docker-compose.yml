# /opt/hermes/docker-compose.yml
# O Hermes fica numa rede interna (só o nginx enxerga); o nginx é quem entra
# na rede "proxy" do Traefik. Segredos ficam em /opt/hermes/.env (fora do Git).
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: 1gb
    env_file: .env
    volumes:
      - ./data:/opt/data
    mem_limit: 1536m
    cpus: 1.0

  hermes-web:
    image: nginx:alpine
    container_name: hermes-web
    restart: unless-stopped
    depends_on:
      - hermes
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/theme:/usr/share/nginx/theme:ro
    mem_limit: 64m
    cpus: 0.2
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
