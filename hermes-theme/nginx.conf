# Proxy fino na frente do Hermes: injeta o CSS Spotify só na página /login
# e serve a fonte/tema estáticos em /_theme/. Todo o resto passa direto
# (inclusive WebSocket do chat), com a autenticação do próprio Hermes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /_theme/ {
        alias /usr/share/nginx/theme/;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /login {
        proxy_pass http://hermes:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/_theme/login.css"></head>';
    }

    location / {
        proxy_pass http://hermes:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
